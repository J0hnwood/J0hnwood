<text x="22" y="270" xml:space="preserve"><tspan fill="#ff5f56">[ ] </tspan><tspan fill="#c9d1d9">Chain bugs : SSRF → internal RCE, SSTI, insecure deserialization</tspan></text>
<text x="22" y="291" xml:space="preserve"><tspan fill="#ff5f56">[ ] </tspan><tspan fill="#c9d1d9">Break auth : JWT · OAuth · session logic flaws</tspan></text>
<text x="22" y="312" xml:space="preserve"><tspan fill="#ff5f56">[ ] </tspan><tspan fill="#c9d1d9">Prototype pollution &amp; race conditions in modern web apps</tspan></text>
<text x="22" y="333" xml:space="preserve"><tspan fill="#ff5f56">[ ] </tspan><tspan fill="#c9d1d9">Submit valid reports to a real bug bounty program</tspan></text>
<text x="22" y="375" xml:space="preserve"><tspan fill="#bc8cff"># ── [ REVERSING ] </tspan><tspan fill="#5c6370">────────────────────────────────</tspan></text>
<text x="22" y="396" xml:space="preserve"><tspan fill="#ff5f56">[ ] </tspan><tspan fill="#c9d1d9">Unpack packed binaries &amp; defeat anti-debugging tricks</tspan></text>
