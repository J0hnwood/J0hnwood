<text x="22" y="123" xml:space="preserve"><tspan fill="#bc8cff"># ── [ PWN ] </tspan><tspan fill="#5c6370">──────────────────────────────────────</tspan></text>
<text x="22" y="144" xml:space="preserve"><tspan fill="#ff5f56">[ ] </tspan><tspan fill="#c9d1d9">Bypass NX · ASLR · PIE · Canary and chain full ROP exploits</tspan></text>
<text x="22" y="165" xml:space="preserve"><tspan fill="#ff5f56">[ ] </tspan><tspan fill="#c9d1d9">glibc heap exploitation : tcache · fastbin · unsorted bin attacks</tspan></text>
